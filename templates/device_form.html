{% extends "base.html" %}{% block content %}<h2>登记设备</h2><form method="post" class="form"><label>编号 <input name="code" required></label><label>名称 <input name="name" required></label><label>类型 <select name="type"><option>水质传感器</option><option>水泵</option><option>增氧机</option><option>其他</option></select></label><label>点位 <select name="point_id">{% for p in points %}<option value="{{ p['id'] }}">{{ p['name'] }}</option>{% endfor %}</select></label><label>安装日期 <input type="date" name="install_date" value="{{ today }}" required></label><label>下次维保日期 <input type="date" name="next_maintenance_date" required></label><label>状态 <select name="status"><option>正常</option><option>故障</option><option>维修中</option><option>报废</option></select></label><button>保存</button></form>{% endblock %}
