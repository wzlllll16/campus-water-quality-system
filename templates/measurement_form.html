{% extends "base.html" %}{% block content %}<h2>登记监测数据</h2><form method="post" class="form"><label>点位 <select name="point_id">{% for p in points %}<option value="{{ p['id'] }}">{{ p['name'] }}</option>{% endfor %}</select></label><label>日期 <input type="date" name="measure_date" value="{{ today }}" required></label><label>水温（℃） <input type="number" step="0.1" name="temperature"></label><label>pH <input type="number" step="0.1" name="ph" required></label><label>溶解氧（mg/L） <input type="number" step="0.1" name="dissolved_oxygen" required></label><label>浑浊度（NTU） <input type="number" step="0.1" name="turbidity" required></label><label>氨氮（mg/L） <input type="number" step="0.01" name="ammonia" required></label><label>备注 <input name="remark"></label><button>提交并自动判定</button></form>{% endblock %}
