{% extends "base.html" %}{% block content %}<h2>{{ '编辑点位' if point else '新增点位' }}</h2>
<form method="post" class="form"><label>编号 <input name="code" value="{{ point['code'] if point else '' }}" required></label><label>名称 <input name="name" value="{{ point['name'] if point else '' }}" required></label><label>类型 <select name="type"><option>湖泊</option><option>景观水池</option><option>绿化带</option><option>其他</option></select></label><label>位置 <input name="location" value="{{ point['location'] if point else '' }}" required></label><label>负责人 <input name="manager" value="{{ point['manager'] if point else '' }}" required></label>{% if point %}<label>状态 <select name="status"><option {{ 'selected' if point['status']=='启用' }}>启用</option><option {{ 'selected' if point['status']=='停用' }}>停用</option></select></label>{% endif %}<button>保存</button></form>{% endblock %}
