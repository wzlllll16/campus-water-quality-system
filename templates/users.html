{% extends "base.html" %}{% block content %}<h2>账号管理</h2><p class="muted">不开放自主注册，仅管理员创建账号。</p><a class="btn" href="{{ url_for('user_add') }}">创建账号</a>
<table><tr><th>用户名</th><th>姓名</th><th>角色</th><th>状态</th><th>创建时间</th><th>操作</th></tr>{% for u in users %}<tr><td>{{ u['username'] }}</td><td>{{ u['real_name'] }}</td><td>{{ role_names.get(u['role'],'') }}</td><td>{{ '启用' if u['status']=='active' else '停用' }}</td><td>{{ u['created_at'] }}</td><td><form method="post" action="{{ url_for('user_toggle', uid=u['id']) }}"><button>{{ '停用' if u['status']=='active' else '启用' }}</button></form></td></tr>{% endfor %}</table>{% endblock %}
