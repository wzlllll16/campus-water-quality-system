{% extends "base.html" %}{% block content %}<h2>派发巡检任务</h2><form method="post" class="form"><label>点位 <select name="point_id">{% for p in points %}<option value="{{ p['id'] }}">{{ p['name'] }}</option>{% endfor %}</select></label><label>任务名称 <input name="title" required></label><label>周期 <select name="cycle"><option>每周</option><option>每月</option><option>每天</option></select></label><label>责任人 <input name="assignee" required></label><label>计划日期 <input type="date" name="planned_date" required></label><button>派发</button></form>{% endblock %}
