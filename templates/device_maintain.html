{% extends "base.html" %}{% block content %}<h2>维保记录：{{ device['name'] }}</h2>
<form method="post" class="form"><label>类型 <select name="type"><option>定期维保</option><option>维修</option><option>故障处理</option></select></label><label>维保日期 <input type="date" name="maintain_date" value="{{ today }}" required></label><label>内容 <input name="content" required></label><label>下次维保日期 <input type="date" name="next_maintenance_date"></label><label>设备状态 <select name="device_status"><option>正常</option><option>故障</option><option>维修中</option></select></label><button>保存维保记录</button></form>
<h3>历史维保日志</h3><table><tr><th>日期</th><th>类型</th><th>内容</th><th>维保人</th></tr>{% for l in logs %}<tr><td>{{ l['maintain_date'] }}</td><td>{{ l['type'] }}</td><td>{{ l['content'] }}</td><td>{{ l['maintainer'] }}</td></tr>{% endfor %}</table>{% endblock %}
